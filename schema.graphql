type Query {
  getNotesByEnrollment(enrollmentId: String!): [NoteReturn]
  getAllCourses(skip: Float!): CourseReturn!
  getAllPublishedCourses(skip: Float!): CourseReturn!
  getCoursesByStatus(status: StatusCourse!, skip: Float!): CourseReturn!
  getCourseById(id: String!): CourseDto
  getCourseByUserId(userId: String!): [CourseDto!]
  getCoursePrice(courseId: String!): CoursePriceDto!
  currentUser: UserReturn!
  hello: String!
  INSTRUCTOR: String!
  getAllLessons: LessonReturn!
  getLessonsByCourseId(id: String!): LessonReturn!
  getLessonById(id: String!): LessonReturn
  getProgress(progressId: String!): ProgressReturn!
  getProgressByUserAndCourse(
    userId: String!
    courseId: String!
  ): ProgressReturn!
  getProgressLessonByUserAndCourse(
    userId: String!
    courseId: String!
  ): ProgressLessonReturn!
  users: UserReturn!
  user: UserResponse!
  userAdmin(userId: String!): UserResponse!
  lessonExplanation(id: String!): LessonExplanationResponse
  lessonExplanationByLessonAndUser(
    lessonId: String!
    userId: String!
  ): LessonExplanationResponse
  getUserEnrollments(userId: String!): [EnrollmentResponse!]!
  findEnrollment(courseId: String!): EnrollmentResponse
  countSuccessEnrollments(userId: String!): CompleteCourseResponse
  countInProgressEnrollments(userId: String!): InProgressCourseResponse
  systemPrompts: [SystemPromptResponse!]!
  systemPrompt(id: String!): SystemPromptResponse!
  myConversations: [ConversationResponse!]!
  conversation(id: String!): ConversationResponse
  message(id: String!): MessageResponse
  messagesByConversation(conversationId: String!): [MessageResponse!]!
  getMindMapByCourse(courseId: String!): MindMapResponse
  getNodeById(id: String!): NodeResponse
  getAllNodeMindMap(mindmapId: String!): [NodeResponse!]
  getAllDocuments: [Document!]!
  getDocumentById(id: String!): Document
  getSectionByLesson(lessonId: String!): [SectionResponse!]
  getMessages(conversationId: String!, take: Float): [Message!]!
  getMyConversations: [Conversation!]!
  payment(paymentId: String!): Payment
  myPayments: [Payment!]!
  checkPaymentStatus(input: CheckPaymentStatusInput!): PaymentStatusResponse!
  getReviewsByCourse(courseId: String!): ReviewResponse
}

input CheckPaymentStatusInput {
  paymentId: String!
}

type Mutation {
  createNote(data: CreateNoteInput!): NoteResponse!
  updateNote(id: String!, data: UpdateNoteInput!): NoteResponse!
  deleteNote(id: String!): NoteResponse!
  createCourse(data: CreateCourseDto!): CourseReturn!
  updateCourse(data: UpdateCourseDto!): CourseReturn!
  deleteCourse(id: String!): CourseReturn!
  publishCourse(courseId: String!): CourseReturn!
  rejectCourse(courseId: String!): CourseReturn!
  register(data: RegisterInput!): GenericResponse!
  verifyEmail(token: String!): GenericResponse!
  login(data: LoginInput!): AuthResponse!
  googleLogin(idToken: String!): AuthResponse!
  refresh: GenericResponse!
  logout: GenericResponse!
  createLessonFromAi(
    data: CreateLessonFromAiInput!
    pdfFile: Upload!
  ): AiLessonResponse!
  updateLesson(data: UpdateLessonDto!): LessonReturn!
  deleteLesson(id: String!): LessonReturn!
  markDone(id: String!, isDone: Boolean!): LessonReturn!
  updateProgress(input: UpdateProgressInput!): ProgressReturn!
  initProgressEnroll(input: CreateProgressInput!): InitEnrollProgessReturn!
  markCompleteLesson(input: MarkCompleteInput!): ProgressLessonReturn!
  createUser(data: CreateUserInput!): UserResponse!
  updateAdmin(data: UpdateUserAdminInput!): UserResponse!
  updateUser(data: UpdateUserInput!): UserReturn!
  deleteUser(id: String!): Boolean!
  createLessonExplanation(
    data: CreateLessonExplanationInput!
  ): LessonExplanationResponse!
  updateLessonExplanation(
    data: UpdateLessonExplanationInput!
  ): LessonExplanationResponse!
  deleteLessonExplanation(id: String!): LessonExplanationResponse!
  enrollCourse(input: CreateEnrollmentInput!): EnrollmentResponse!
  createSystemPrompt(data: CreateSystemPromptInput!): SystemPromptResponse!
  updateSystemPrompt(
    id: String!
    data: UpdateSystemPromptInput!
  ): SystemPromptResponse!
  deleteSystemPrompt(id: String!): Boolean!
  createConversation(data: CreateConversationInput!): ConversationReturn!
  updateConversation(data: UpdateConversationInput!): ConversationReturn!
  deleteConversation(id: String!): ConversationReturn!
  updateMessage(data: UpdateMessageInput!): MessageResponse!
  deleteMessage(id: String!): MessageResponse!
  createMessage(data: CreateMessage2Input!): MessageResponse!
  createMindMap(data: CreateMindMapInput!): MindMapReturn!
  updateMindMap(id: String!, data: UpdateMindMapInput!): MindMapReturn!
  deleteMindMap(id: String!): MindMapReturn!
  createNode(data: CreateNodeInput!): NodeReturn!
  updateNode(id: String!, data: UpdateNodeInput!): NodeReturn!
  deleteNode(id: String!): NodeReturn!
  uploadDocument(file: Upload!, uploadedBy: String): UploadResponse!
  deleteDocument(id: String!): UploadResponse!
  createSocketToken: String!
  createConversationChat(userIds: [String!]!, title: String): Conversation!
  createPayment(input: CreatePaymentInput!): PaymentResponse!
  cancelPayment(input: CancelPaymentInput!): Boolean!
  updatePaymentStatus(input: UpdatePaymentStatus!): PaymentStatusResponse!
  createReview(data: CreateReviewInput!): ReviewResponse!
}

