worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=30s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2
        model/gltf-binary
        model/gltf+json;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static:1g inactive=365d use_temp_path=off max_size=5g;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    server {
        listen 80;
        server_name _;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|glb)$ {
            proxy_cache static;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating;
            proxy_ignore_headers Cache-Control Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache_lock on;
            add_header Cache-Control "public, immutable, max-age=31536000";
            expires 1y;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        if ($http_x_forwarded_proto = "https") {
            set $real_scheme "https";
        }
        if ($http_x_forwarded_proto != "https") {
            return 301 https://$host$request_uri;
        }

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location ~ ^/(learner_/log-in|learner_/sign-up|learner_/forgot-password) {
            limit_req zone=auth burst=10 nodelay;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|glb)$ {
            proxy_cache static;
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating;
            proxy_ignore_headers Cache-Control Set-Cookie;
            proxy_hide_header Set-Cookie;
            proxy_cache_lock on;
            add_header Cache-Control "public, immutable, max-age=31536000";
            expires 1y;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        ssl_certificate /etc/letsencrypt/live/learnify-edu.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/learnify-edu.duckdns.org/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location ~ ^/(learner_/log-in|learner_/sign-up|learner_/forgot-password) {
            limit_req zone=auth burst=10 nodelay;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            limit_req zone=general burst=50 nodelay;
            set $backend "app:3000";
            proxy_pass http://$backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
    }
}