services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GRAPHQL_ENDPOINT: "${VITE_GRAPHQL_ENDPOINT}"
        VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID}"
        VITE_ELEVENLABS_API_KEY: "${VITE_ELEVENLABS_API_KEY}"
        VITE_ELEVENLABS_VOICE_ID: "${VITE_ELEVENLABS_VOICE_ID}"
        VITE_ELENVENLABS_MODEL_ID: "${VITE_ELENVENLABS_MODEL_ID}"
        VITE_ELEVENLABS_OUTPUT_FORMAT: "${VITE_ELEVENLABS_OUTPUT_FORMAT}"
        VITE_ELENVENLABS_ENABLE_TIMESTAMPS: "${VITE_ELENVENLABS_ENABLE_TIMESTAMPS}"
        VITE_EDGETTS_VOICE_ID: "${VITE_EDGETTS_VOICE_ID}"
    env_file:
      - .env.production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',function(r){process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - learnify-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist/client:/app/dist/client:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - learnify-net

networks:
  learnify-net:
    driver: bridge